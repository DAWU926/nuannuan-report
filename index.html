<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无限暖暖｜代肝每日汇报生成器（多老板版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f7f0f8;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* 左侧老板侧边栏 */
        .sidebar {
            width: 260px;
            background: #fff;
            border-right: 1px solid #e8dceb;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h3 {
            color: #9c5fb4;
            margin-bottom:12px;
            font-size:18px;
        }
        .boss-list-wrap {
            flex: 1;
            overflow-y: auto;
            margin-bottom:12px;
        }
        .boss-item {
            padding:10px 12px;
            border-radius:8px;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:6px;
            background:#f7f0f8;
        }
        .boss-item.active {
            background:#dcc9e6;
        }
        .boss-name {
            flex:1;
            overflow:hidden;
            white-space:nowrap;
            text-overflow:ellipsis;
        }
        .del-boss {
            color:#d9534f;
            padding:2px 6px;
            font-size:14px;
            border:none;
            background:none;
            cursor:pointer;
        }
        .add-boss-btn {
            width:100%;
            padding:10px;
            border:none;
            border-radius:8px;
            background:#b858bc;
            color:#fff;
            font-size:15px;
            cursor:pointer;
        }
        /* 右侧主区域 */
        .main-area {
            flex:1;
            overflow-y:auto;
            padding:24px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 16px rgba(180,120,200,0.15);
            margin-bottom: 24px;
        }
        h1 {
            text-align: center;
            color: #9c5fb4;
            margin-bottom: 24px;
            font-size: 24px;
        }
        .form-row {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #66347a;
            font-weight: 500;
        }
        select, input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e3dcea;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        select:focus, input:focus {
            border-color: #b87fc9;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap:16px;
        }
        .btn-group {
            display:flex;
            gap:12px;
            margin-top:20px;
        }
        button {
            flex:1;
            padding:12px;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            transition:0.2s;
        }
        .btn-gen {
            background:#b858bc;
            color:white;
        }
        .btn-copy {
            background:#f2d8f4;
            color:#7b3980;
        }
        .preview-box {
            background:#fff;
            border-radius:16px;
            padding:24px;
            box-shadow:0 4px 16px rgba(180,120,200,0.15);
        }
        .preview-title {
            color:#9c5fb4;
            font-weight:bold;
            margin-bottom:12px;
        }
        #preview {
            white-space: pre-wrap;
            min-height:320px;
            padding:12px;
            background:#faf5fb;
            border-radius:10px;
            line-height:1.7;
        }
        .check-list {
            margin-top:16px;
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        .check-item {
            display:flex;
            align-items:center;
            gap:8px;
        }
        /* 移动端适配：小屏隐藏侧边栏 */
        @media (max-width:768px) {
            body {
                flex-direction:column;
                overflow:auto;
                height:auto;
            }
            .sidebar {
                width:100%;
                border-right:none;
                border-bottom:1px solid #e8dceb;
            }
        }
    </style>
</head>
<body>
    <!-- 左侧老板列表 -->
    <div class="sidebar">
        <h3>👤老板列表</h3>
        <div class="boss-list-wrap" id="bossListWrap"></div>
        <button class="add-boss-btn" id="addBossBtn">➕ 添加新老板</button>
    </div>
    <!-- 右侧表单区域 -->
    <div class="main-area">
        <div class="card">
            <h1>✨无限暖暖代肝每日汇报生成器</h1>
            <div class="form-row">
                <label>老板备注（尾号/昵称）</label>
                <input id="bossName" placeholder="例如：尾号888 / 包月老板A">
            </div>
            <div class="form-row">
                <label>选择代肝类型</label>
                <select id="typeSel">
                    <option value="single">单日常</option>
                    <option value="double">双日常</option>
                    <option value="triple">三日常</option>
                </select>
            </div>
            <div class="grid-2">
                <div class="form-row">
                    <label>进度</label>
                    <input id="progress" placeholder="自动填充今日日期，可修改">
                </div>
                <div class="form-row">
                    <label>月卡剩余天数</label>
                    <input id="monthCard" placeholder="数字">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-row">
                    <label>奇迹之冠结束天数</label>
                    <input id="miracle" placeholder="数字">
                </div>
                <div class="form-row">
                    <label>五星共鸣阁结束天数</label>
                    <input id="resonate" placeholder="数字">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-row">
                    <label>签到天数</label>
                    <input id="signDay" placeholder="数字">
                </div>
                <div class="form-row">
                    <label>粉钻数量</label>
                    <input id="diamond" placeholder="填写数量">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-row">
                    <label>星光结晶</label>
                    <input id="crystal" placeholder="填写数量">
                </div>
                <div class="form-row">
                    <label>家园记事（仅三日常生效）</label>
                    <input id="homeNote" placeholder="只填前面数字，固定 /2000">
                </div>
            </div>
            <div class="form-row">
                <label>园宝收购（仅三日常生效）</label>
                <input id="yuanBao" placeholder="只填前面数字，固定 /600000">
            </div>
            <div class="check-list">
                <div class="check-item"><input type="checkbox" id="ck1"> <label for="ck1">周本</label></div>
                <div class="check-item"><input type="checkbox" id="ck2"> <label for="ck2">挖掘</label></div>
                <div class="check-item"><input type="checkbox" id="ck3"> <label for="ck3">星光追寻</label></div>
                <div class="check-item"><input type="checkbox" id="ck4"> <label for="ck4">商城每周礼包</label></div>
                <div class="check-item"><input type="checkbox" id="ck5"> <label for="ck5">半月奇迹之冠巅峰赛</label></div>
                <div class="check-item"><input type="checkbox" id="ck6"> <label for="ck6">每周奇迹之冠挑战赛</label></div>
                <div class="check-item"><input type="checkbox" id="ck7"> <label for="ck7">星光小铺</label></div>
            </div>
            <div class="btn-group">
                <button class="btn-gen" id="btnGen">生成汇报文本</button>
                <button class="btn-copy" id="btnCopy">一键复制</button>
            </div>
        </div>
        <div class="preview-box">
            <div class="preview-title">📄生成预览</div>
            <div id="preview"></div>
        </div>
    </div>
<script>
    // 本地存储key
    const STORAGE_KEY = "ww代肝多老板数据";
    // DOM
    const bossListWrap = document.getElementById("bossListWrap");
    const addBossBtn = document.getElementById("addBossBtn");
    const bossNameInput = document.getElementById("bossName");
    const typeSel = document.getElementById("typeSel");
    const progressInput = document.getElementById("progress");
    const monthCardInput = document.getElementById("monthCard");
    const miracleInput = document.getElementById("miracle");
    const resonateInput = document.getElementById("resonate");
    const signDayInput = document.getElementById("signDay");
    const diamondInput = document.getElementById("diamond");
    const crystalInput = document.getElementById("crystal");
    const homeNoteInput = document.getElementById("homeNote");
    const yuanBaoInput = document.getElementById("yuanBao");
    const ckList = [
        document.getElementById("ck1"),
        document.getElementById("ck2"),
        document.getElementById("ck3"),
        document.getElementById("ck4"),
        document.getElementById("ck5"),
        document.getElementById("ck6"),
        document.getElementById("ck7"),
    ];
    const ckNameList = ["周本","挖掘","星光追寻","商城每周礼包","半月奇迹之冠巅峰赛","每周奇迹之冠挑战赛","星光小铺"];
    const btnGen = document.getElementById("btnGen");
    const btnCopy = document.getElementById("btnCopy");
    const preview = document.getElementById("preview");
    let bossDataList = [];
    let activeBossId = null;
    // 获取今天日期
    function getTodayStr(){
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    }
    // 新建空老板对象
    function createEmptyBoss(){
        return {
            id: Date.now().toString(),
            bossName: "新老板",
            typeSel: "single",
            progress: getTodayStr(),
            monthCard: "",
            miracle: "",
            resonate: "",
            signDay: "",
            diamond: "",
            crystal: "",
            homeNote: "",
            yuanBao: "",
            ck: [false,false,false,false,false,false,false]
        }
    }
    // 读取本地数据
    function loadStorage(){
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
            bossDataList = JSON.parse(raw);
        }else{
            // 没有数据，自动创建第一个老板
            bossDataList = [createEmptyBoss()];
        }
    }
    // 保存全部数据到本地
    function saveStorage(){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bossDataList));
    }
    // 渲染左侧老板列表
    function renderBossList(){
        bossListWrap.innerHTML = "";
        bossDataList.forEach(boss=>{
            const div = document.createElement("div");
            div.className = "boss-item " + (boss.id === activeBossId ? "active" : "");
            div.innerHTML = `
                <span class="boss-name">${boss.bossName || "未命名老板"}</span>
                <button class="del-boss">×</button>
            `;
            // 切换老板
            div.addEventListener("click", (e)=>{
                if(e.target.classList.contains("del-boss")) return;
                saveCurrentBoss();
                activeBossId = boss.id;
                loadBossToForm(boss);
                renderBossList();
            })
            // 删除老板
            div.querySelector(".del-boss").addEventListener("click", ()=>{
                if(bossDataList.length <=1){
                    alert("至少保留一个老板！");
                    return;
                }
                bossDataList = bossDataList.filter(item=>item.id !== boss.id);
                if(activeBossId === boss.id){
                    activeBossId = bossDataList[0].id;
                    loadBossToForm(bossDataList[0]);
                }
                saveStorage();
                renderBossList();
            })
            bossListWrap.appendChild(div);
        })
    }
    // 将老板数据填充到表单
    function loadBossToForm(boss){
        bossNameInput.value = boss.bossName;
        typeSel.value = boss.typeSel;
        progressInput.value = boss.progress;
        monthCardInput.value = boss.monthCard;
        miracleInput.value = boss.miracle;
        resonateInput.value = boss.resonate;
        signDayInput.value = boss.signDay;
        diamondInput.value = boss.diamond;
        crystalInput.value = boss.crystal;
        homeNoteInput.value = boss.homeNote;
        yuanBaoInput.value = boss.yuanBao;
        boss.ck.forEach((val,idx)=>{
            ckList[idx].checked = val;
        })
    }
    // 把当前表单保存到当前选中老板
    function saveCurrentBoss(){
        const boss = bossDataList.find(item=>item.id === activeBossId);
        if(!boss) return;
        boss.bossName = bossNameInput.value.trim();
        boss.typeSel = typeSel.value;
        boss.progress = progressInput.value.trim();
        boss.monthCard = monthCardInput.value.trim();
        boss.miracle = miracleInput.value.trim();
        boss.resonate = resonateInput.value.trim();
        boss.signDay = signDayInput.value.trim();
        boss.diamond = diamondInput.value.trim();
        boss.crystal = crystalInput.value.trim();
        boss.homeNote = homeNoteInput.value.trim();
        boss.yuanBao = yuanBaoInput.value.trim();
        boss.ck = ckList.map(el=>el.checked);
        saveStorage();
    }
    // 添加新老板
    addBossBtn.addEventListener("click", ()=>{
        saveCurrentBoss();
        const newBoss = createEmptyBoss();
        bossDataList.push(newBoss);
        activeBossId = newBoss.id;
        loadBossToForm(newBoss);
        saveStorage();
        renderBossList();
    })
    // 生成汇报文本
    btnGen.onclick = function(){
        saveCurrentBoss();
        const boss = bossDataList.find(item=>item.id === activeBossId);
        if(!boss) return;
        const type = boss.typeSel;
        const progress = boss.progress || "/";
        const monthCard = boss.monthCard;
        const miracle = boss.miracle;
        const resonate = boss.resonate;
        const signDay = boss.signDay;
        const diamond = boss.diamond;
        const crystal = boss.crystal;
        const homeNoteVal = boss.homeNote;
        const yuanBaoVal = boss.yuanBao;
        const ckState = boss.ck;
        let text = "";

        if(type === "single"){
            // 单日常模板
            text += `ㆍ┈ㆍ┈ㆍ┈ ✦ ┈ㆍ┈ㆍ┈ㆍ\n`;
            text += `💭◦代肝内容：单日常\n`;
            text += `💭◦进度：${progress}\n`;
            text += `⋆✩—·༺ 倒计时༻·—\n`;
            if(monthCard) text += `📍◦月卡时间：剩余 ${monthCard} 天\n`;
            if(miracle) text += `📍◦奇迹之冠 ${miracle} 天后结束\n`;
            if(resonate) text += `📍◦五星共鸣阁 ${resonate} 天后结束\n`;
            if(signDay) text += `📍◦签到 已兑换 ${signDay} 天\n`;
            text += `⋆✩—·༺ 资源༻·—\n`;
            if(diamond) text += `✨️◦粉钻：${diamond}\n`;
            if(crystal) text += `✨️◦星光结晶：${crystal}\n`;
            text += `✨️◦体力：已清空\n`;
            text += `⋆✩—·༺ 其它༻·—\n`;
            //单日常：只取 周本、挖掘、商城每周礼包、半月奇迹之冠巅峰赛、每周奇迹之冠挑战赛
            const singleIdx = [0,1,3,4,5];
            singleIdx.forEach(i=>{
                text += `${ckNameList[i]}${ckState[i] ? "✔" : "○"}\n`;
            })
        }else if(type === "double"){
            //双日常模板
            text += `ㆍ┈ㆍ┈ㆍ┈ ✦ ┈ㆍ┈ㆍ┈ㆍ\n`;
            text += `💭◦代肝内容：双日常\n`;
            text += `💭◦进度：${progress}\n`;
            text += `⋆✩—·༺ 倒计时༻·—\n`;
            if(monthCard) text += `📍◦月卡时间：剩余 ${monthCard} 天\n`;
            if(miracle) text += `📍◦奇迹之冠 ${miracle} 天后结束\n`;
            if(resonate) text += `📍◦五星共鸣阁 ${resonate} 天后结束\n`;
            if(signDay) text += `📍◦签到 已兑换 ${signDay} 天\n`;
            text += `⋆✩—·༺ 资源༻·—\n`;
            if(diamond) text += `✨️◦粉钻：${diamond}\n`;
            if(crystal) text += `✨️◦星光结晶：${crystal}\n`;
            text += `✨️◦体力：已清空\n`;
            text += `⋆✩—·༺ 其它༻·—\n`;
            //双日常全部7项
            ckState.forEach((checked,idx)=>{
                text += `${ckNameList[idx]}${checked ? "✔" : "○"}\n`;
            })
        }else if(type === "triple"){
            //三日常模板
            text += `ㆍ┈ㆍ┈ㆍ┈ ✦ ┈ㆍ┈ㆍ┈ㆍ\n`;
            text += `💭◦代肝内容：三日常\n`;
            text += `💭◦进度：${progress}\n`;
            text += `⋆✩—·༺ 倒计时༻·—\n`;
            if(monthCard) text += `📍◦月卡时间：剩余 ${monthCard} 天\n`;
            if(miracle) text += `📍◦奇迹之冠 ${miracle} 天后结束\n`;
            if(resonate) text += `📍◦五星共鸣阁 ${resonate} 天后结束\n`;
            if(signDay) text += `📍◦已签到 ${signDay} 天\n`;
            text += `⋆✩—·༺ 资源汇报༻·—\n`;
            if(diamond) text += `✨️◦粉钻：${diamond}\n`;
            if(crystal) text += `✨️◦星光结晶：${crystal}\n`;
            text += `✨️◦体力：已清空\n`;
            text += `⋆✩—·༺ 家园༻·—\n`;
            if(homeNoteVal) text += `🌸◦家园记事：${homeNoteVal}/2000 \n`;
            if(yuanBaoVal) text += `🌸◦园宝收购：${yuanBaoVal}/600000\n`;
            text += `⋆✩—·༺ 其它༻·—\n`;
            //三日常全部7项
            ckState.forEach((checked,idx)=>{
                text += `${ckNameList[idx]}${checked ? "✔" : "○"}\n`;
            })
        }
        text += `(☆▽☆)汇报完毕 已下号`;
        preview.innerText = text;
    }
    // 一键复制
    btnCopy.onclick = async function(){
        const txt = preview.innerText;
        if(!txt.trim()){
            alert("请先生成汇报文本！");
            return;
        }
        try{
            await navigator.clipboard.writeText(txt);
            alert("✅复制成功！直接发给老板～");
        }catch(e){
            alert("复制失败，请手动全选复制");
        }
    }
    // 初始化
    loadStorage();
    activeBossId = bossDataList[0].id;
    loadBossToForm(bossDataList[0]);
    renderBossList();
    // 表单改动自动保存
    const allInputs = document.querySelectorAll("input, select");
    allInputs.forEach(input=>{
        input.addEventListener("change", ()=>{
            saveCurrentBoss();
        })
    })
</script>
</body>
</html>
