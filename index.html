<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无限暖暖｜代肝每日汇报生成器（多老板版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f7f0f8;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* 左侧老板栏 */
        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #e8dceb;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h3 {
            color: #9c5fb4;
            margin-bottom:12px;
            font-size:18px;
        }
        .boss-list-wrap {
            flex: 1;
            overflow-y: auto;
            margin-bottom:12px;
        }
        .boss-item {
            padding:10px 12px;
            border-radius:8px;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:6px;
            background:#f7f0f8;
        }
        .boss-item.active {
            background:#dcc9e6;
        }
        .boss-name {
            flex:1;
            overflow:hidden;
            white-space:nowrap;
            text-overflow:ellipsis;
        }
        .del-boss {
            color:#d9534f;
            padding:2px 4px;
            font-size:14px;
            border:none;
            background:none;
            cursor:pointer;
        }
        .add-boss-btn {
            width:100%;
            padding:10px;
            border:none;
            border-radius:8px;
            background:#b858bc;
            color:#fff;
            font-size:15px;
            cursor:pointer;
        }
        /* 主内容区 */
        .main-area {
            flex:1;
            overflow-y:auto;
            padding:24px;
        }
        .card {
            background:#fff;
            border-radius:16px;
            padding:28px;
            box-shadow:0 4px 16px rgba(180,120,188,0.12);
            margin-bottom:24px;
        }
        h1 {
            text-align:center;
            color:#9c5fb4;
            margin-bottom:24px;
            font-size:22px;
        }
        .form-row {
            margin-bottom:16px;
        }
        label {
            display:block;
            margin-bottom:6px;
            color:#66347a;
            font-weight:500;
        }
        select, input {
            width:100%;
            padding:10px 14px;
            border:1px solid #e3dcea;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }
        select:focus, input:focus {
            border-color:#b87fc9;
        }
        .grid-2 {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
        }
        .check-list {
            margin-top:16px;
            display:flex;
            flex-direction:column;
            gap:10px;
            align-items:flex-end;
            padding-right:8px;
        }
        .check-item {
            display:flex;
            flex-direction:row-reverse;
            gap:8px;
            align-items:center;
        }
        .check-item input[type="checkbox"] {
            width:auto;
        }
        .btn-group {
            display:flex;
            gap:12px;
            margin-top:24px;
        }
        button {
            flex:1;
            padding:12px;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
        }
        .btn-gen {
            background:#b858bc;
            color:#fff;
        }
        .btn-copy {
            background:#f2d8f4;
            color:#7b3980;
        }
        .preview-box {
            background:#fff;
            border-radius:16px;
            padding:24px;
            box-shadow:0 4px 16px rgba(180,120,188,0.12);
        }
        .preview-title {
            color:#9c5fb4;
            font-weight:bold;
            margin-bottom:12px;
        }
        #preview {
            white-space:pre-wrap;
            min-height:320px;
            padding:12px;
            background:#faf5fb;
            border-radius:10px;
            line-height:1.7;
        }
        @media (max-width:768px) {
            body {
                flex-direction:column;
                overflow:auto;
            }
            .sidebar {
                width:100%;
                border-right:none;
                border-bottom:1px solid #e8dceb;
            }
            .main-area {
                padding:16px;
            }
            .grid-2 {
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 左侧老板列表 -->
    <div class="sidebar">
        <h3>👤老板列表</h3>
        <div class="boss-list-wrap" id="bossListWrap"></div>
        <button class="add-boss-btn" id="addBossBtn">➕ 添加新老板</button>
    </div>
    <!-- 右侧主表单 -->
    <div class="main-area">
        <div class="card">
            <h1>✨无限暖暖代肝每日汇报生成器</h1>
            <div class="form-row">
                <label>老板备注（尾号/昵称）</label>
                <input id="bossName" placeholder="例如：尾号888 / 老板A">
            </div>
            <div class="form-row">
                <label>选择代肝类型</label>
                <select id="typeSel">
                    <option value="single">单日常</option>
                    <option value="double">双日常</option>
                    <option value="triple">三日常</option>
                </select>
            </div>
            <div class="grid-2">
                <div class="form-row">
                    <label>进度</label>
                    <input id="progress" placeholder="自行填写进度内容">
                </div>
                <div class="form-row">
                    <label>月卡剩余天数</label>
                    <input id="monthCard" placeholder="数字">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-row">
                    <label>奇迹之冠结束天数</label>
                    <input id="miracle" placeholder="数字">
                </div>
                <div class="form-row">
                    <label>五星共鸣阁结束天数</label>
                    <input id="resonate" placeholder="数字">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-row">
                    <label>签到天数</label>
                    <input id="signDay" placeholder="数字">
                </div>
                <div class="form-row">
                    <label>粉钻数量</label>
                    <input id="diamond" placeholder="填写数量">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-row">
                    <label>星光结晶</label>
                    <input id="crystal" placeholder="填写数量">
                </div>
                <div class="form-row">
                    <label>家园记事（仅三日常生效）</label>
                    <input id="homeNote" placeholder="只填前面数字，固定 /2000">
                </div>
            </div>
            <div class="form-row">
                <label>园宝收购（仅三日常生效）</label>
                <input id="yuanBao" placeholder="只填前面数字，固定 /600000">
            </div>
            <!-- 勾选区：文字在前，复选框在后面，全部右对齐 -->
            <div class="check-list" id="checkList">
                <div class="check-item">
                    <span>周本</span>
                    <input type="checkbox" id="ck1">
                </div>
                <div class="check-item">
                    <span>挖掘</span>
                    <input type="checkbox" id="ck2">
                </div>
                <div class="check-item">
                    <span>星光追寻</span>
                    <input type="checkbox" id="ck3">
                </div>
                <div class="check-item">
                    <span>商城每周礼包</span>
                    <input type="checkbox" id="ck4">
                </div>
                <div class="check-item">
                    <span>半月奇迹之冠巅峰赛</span>
                    <input type="checkbox" id="ck5">
                </div>
                <div class="check-item">
                    <span>每周奇迹之冠挑战赛</span>
                    <input type="checkbox" id="ck6">
                </div>
                <div class="check-item">
                    <span>星光小铺</span>
                    <input type="checkbox" id="ck7">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-gen" id="btnGen">生成汇报文本</button>
                <button class="btn-copy" id="btnCopy">一键复制</button>
            </div>
        </div>
        <div class="preview-box">
            <div class="preview-title">📄生成预览</div>
            <div id="preview"></div>
        </div>
    </div>

<script>
    const STORAGE_KEY = "ww_dg_multi_boss_v3";
    // DOM
    const bossListWrap = document.getElementById("bossListWrap");
    const addBossBtn = document.getElementById("addBossBtn");
    const bossNameInput = document.getElementById("bossName");
    const typeSel = document.getElementById("typeSel");
    const progressInput = document.getElementById("progress");
    const monthCardInput = document.getElementById("monthCard");
    const miracleInput = document.getElementById("miracle");
    const resonateInput = document.getElementById("resonate");
    const signDayInput = document.getElementById("signDay");
    const diamondInput = document.getElementById("diamond");
    const crystalInput = document.getElementById("crystal");
    const homeNoteInput = document.getElementById("homeNote");
    const yuanBaoInput = document.getElementById("yuanBao");
    const ckList = [
        document.getElementById("ck1"),
        document.getElementById("ck2"),
        document.getElementById("ck3"),
        document.getElementById("ck4"),
        document.getElementById("ck5"),
        document.getElementById("ck6"),
        document.getElementById("ck7"),
    ];
    const ckNameList = ["周本","挖掘","星光追寻","商城每周礼包","半月奇迹之冠巅峰赛","每周奇迹之冠挑战赛","星光小铺"];
    const btnGen = document.getElementById("btnGen");
    const btnCopy = document.getElementById("btnCopy");
    const previewBox = document.getElementById("preview");

    let bossDataList = [];
    let activeBossId = null;

    // 读取本地存储
    function loadStorage(){
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
            bossDataList = JSON.parse(raw);
        }else{
            bossDataList = [createEmptyBoss()];
        }
        if(!bossDataList.length) bossDataList = [createEmptyBoss()];
        activeBossId = bossDataList[0].id;
        renderBossList();
        loadBossToForm(getCurrentBoss());
    }
    function saveStorage(){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bossDataList));
    }
    function createEmptyBoss(){
        return {
            id: Date.now().toString(),
            bossName: "新老板",
            typeSel: "single",
            progress: "",
            monthCard: "",
            miracle: "",
            resonate: "",
            signDay: "",
            diamond: "",
            crystal: "",
            homeNote: "",
            yuanBao: "",
            ck: [false,false,false,false,false,false,false]
        }
    }
    function getCurrentBoss(){
        return bossDataList.find(b=>b.id === activeBossId) || createEmptyBoss();
    }
    function renderBossList(){
        bossListWrap.innerHTML = "";
        bossDataList.forEach(boss=>{
            const div = document.createElement("div");
            div.className = "boss-item " + (boss.id === activeBossId ? "active":"");
            div.innerHTML = `
                <span class="boss-name">${boss.bossName || "未命名老板"}</span>
                <button class="del-boss">×</button>
            `;
            div.addEventListener("click", (e)=>{
                if(e.target.classList.contains("del-boss")) return;
                saveCurrentBoss();
                activeBossId = boss.id;
                loadBossToForm(getCurrentBoss());
                renderBossList();
            })
            div.querySelector(".del-boss").addEventListener("click", ()=>{
                if(bossDataList.length <=1){
                    alert("至少保留一个老板！");
                    return;
                }
                bossDataList = bossDataList.filter(item=>item.id !== boss.id);
                if(activeBossId === boss.id) activeBossId = bossDataList[0].id;
                saveStorage();
                renderBossList();
                loadBossToForm(getCurrentBoss());
            })
            bossListWrap.appendChild(div);
        })
    }
    function loadBossToForm(boss){
        bossNameInput.value = boss.bossName;
        typeSel.value = boss.typeSel;
        progressInput.value = boss.progress;
        monthCardInput.value = boss.monthCard;
        miracleInput.value = boss.miracle;
        resonateInput.value = boss.resonate;
        signDayInput.value = boss.signDay;
        diamondInput.value = boss.diamond;
        crystalInput.value = boss.crystal;
        homeNoteInput.value = boss.homeNote;
        yuanBaoInput.value = boss.yuanBao;
        boss.ck.forEach((val,idx)=> ckList[idx].checked = val);
    }
    function saveCurrentBoss(){
        const boss = getCurrentBoss();
        boss.bossName = bossNameInput.value.trim();
        boss.typeSel = typeSel.value;
        boss.progress = progressInput.value.trim();
        boss.monthCard = monthCardInput.value.trim();
        boss.miracle = miracleInput.value.trim();
        boss.resonate = resonateInput.value.trim();
        boss.signDay = signDayInput.value.trim();
        boss.diamond = diamondInput.value.trim();
        boss.crystal = crystalInput.value.trim();
        boss.homeNote = homeNoteInput.value.trim();
        boss.yuanBao = yuanBaoInput.value.trim();
        boss.ck = ckList.map(el=>el.checked);
        saveStorage();
        renderBossList();
    }
    addBossBtn.addEventListener("click", ()=>{
        saveCurrentBoss();
        const newBoss = createEmptyBoss();
        bossDataList.push(newBoss);
        activeBossId = newBoss.id;
        saveStorage();
        renderBossList();
        loadBossToForm(newBoss);
    })
    // 生成汇报
    btnGen.addEventListener("click", function(){
        saveCurrentBoss();
        const boss = getCurrentBoss();
        const type = boss.typeSel;
        const progress = boss.progress || "/";
        const monthCard = boss.monthCard;
        const miracle = boss.miracle;
        const resonate = boss.resonate;
        const signDay = boss.signDay;
        const diamond = boss.diamond;
        const crystal = boss.crystal;
        const homeNoteVal = boss.homeNote;
        const yuanBaoVal = boss.yuanBao;
        const ckState = boss.ck;
        let text = "";

        if(type === "single"){
            text += `ㆍ┈ㆍ┈ㆍ┈ ✦ ┈ㆍ┈ㆍ┈ㆍ\n`;
            text += `💭◦代肝内容：单日常\n`;
            text += `💭◦进度：${progress}\n`;
            text += `⋆✩—·༺ 倒计时༻·—\n`;
            if(monthCard) text += `📍◦月卡时间：剩余 ${monthCard} 天\n`;
            if(miracle) text += `📍◦奇迹之冠 ${miracle} 天后结束\n`;
            if(resonate) text += `📍◦五星共鸣阁 ${resonate} 天后结束\n`;
            if(signDay) text += `📍◦签到 已兑换 ${signDay} 天\n`;
            text += `⋆✩—·༺ 资源༻·—\n`;
            if(diamond) text += `✨️◦粉钻：${diamond}\n`;
            if(crystal) text += `✨️◦星光结晶：${crystal}\n`;
            text += `✨️◦体力：已清空\n`;
            text += `⋆✩—·༺ 其它༻·—\n`;
            const singleIdx = [0,1,3,4,5];
            singleIdx.forEach(i=>{
                text += `${ckNameList[i]}${ckState[i] ? "✔" : ""}\n`;
            })
        }else if(type === "double"){
            text += `ㆍ┈ㆍ┈ㆍ┈ ✦ ┈ㆍ┈ㆍ┈ㆍ\n`;
            text += `💭◦代肝内容：双日常\n`;
            text += `💭◦进度：${progress}\n`;
            text += `⋆✩—·༺ 倒计时༻·—\n`;
            if(monthCard) text += `📍◦月卡时间：剩余 ${monthCard} 天\n`;
            if(miracle) text += `📍◦奇迹之冠 ${miracle} 天后结束\n`;
            if(resonate) text += `📍◦五星共鸣阁 ${resonate} 天后结束\n`;
            if(signDay) text += `📍◦签到 已兑换 ${signDay} 天\n`;
            text += `⋆✩—·༺ 资源༻·—\n`;
            if(diamond) text += `✨️◦粉钻：${diamond}\n`;
            if(crystal) text += `✨️◦星光结晶：${crystal}\n`;
            text += `✨️◦体力：已清空\n`;
            text += `⋆✩—·༺ 其它༻·—\n`;
            ckState.forEach((checked,idx)=>{
                text += `${ckNameList[idx]}${checked ? "✔" : ""}\n`;
            })
        }else if(type === "triple"){
            text += `ㆍ┈ㆍ┈ㆍ┈ ✦ ┈ㆍ┈ㆍ┈ㆍ\n`;
            text += `💭◦代肝内容：三日常\n`;
            text += `💭◦进度：${progress}\n`;
            text += `⋆✩—·༺ 倒计时༻·—\n`;
            if(monthCard) text += `📍◦月卡时间：剩余 ${monthCard} 天\n`;
            if(miracle) text += `📍◦奇迹之冠 ${miracle} 天后结束\n`;
            if(resonate) text += `📍◦五星共鸣阁 ${resonate} 天后结束\n`;
            if(signDay) text += `📍◦已签到 ${signDay} 天\n`;
            text += `⋆✩—·༺ 资源汇报༻·—\n`;
            if(diamond) text += `✨️◦粉钻：${diamond}\n`;
            if(crystal) text += `✨️◦星光结晶：${crystal}\n`;
            text += `✨️◦体力：已清空\n`;
            text += `⋆✩—·༺ 家园༻·—\n`;
            if(homeNoteVal) text += `🌸◦家园记事：${homeNoteVal}/2000 \n`;
            if(yuanBaoVal) text += `🌸◦园宝收购：${yuanBaoVal}/600000\n`;
            text += `⋆✩—·༺ 其它༻·—\n`;
            ckState.forEach((checked,idx)=>{
                text += `${ckNameList[idx]}${checked ? "✔" : ""}\n`;
            })
        }
        text += `(☆▽☆)汇报完毕 已下号`;
        previewBox.innerText = text;
    })
    // 一键复制
    btnCopy.addEventListener("click", async function(){
        const txt = previewBox.innerText;
        if(!txt.trim()){
            alert("请先生成汇报文本！");
            return;
        }
        try{
            await navigator.clipboard.writeText(txt);
            alert("✅复制成功！");
        }catch(e){
            alert("复制失败，请手动全选复制");
        }
    })
    // 输入变更自动保存
    const allInputs = document.querySelectorAll("input, select");
    allInputs.forEach(input=>{
        input.addEventListener("change", ()=>{
            saveCurrentBoss();
        })
    })
    loadStorage();
</script>
</body>
</html>
